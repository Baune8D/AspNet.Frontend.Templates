version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/examples/*"
      - "/templates/*"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fork-ts-checker-webpack-plugin"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    groups:
      dependencies:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directories:
      - "/build"
      - "/examples/*"
      - "/templates/*"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
